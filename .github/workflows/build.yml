# Build the binaries for the SteamOS host, test, and package the release on Ubuntu 24.04 aarch64
# (glibc 2.39, as SteamOS on the Frame), on the Frametop org's Depot runners. A v* tag also makes
# a draft GitHub release with the tarball, get-hand-recorder.sh and SHA256SUMS (a pre-release when
# the tag has a "-", as v0.2.0-rc1): check it, then publish it by hand.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: depot-ubuntu-24.04-arm-4
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0   # tags, for the version and Frametop's describe

      - name: Packages
        run: |
          sudo apt-get update -qq
          cat scripts/build-deps.txt scripts/test-deps.txt |
            sudo DEBIAN_FRONTEND=noninteractive xargs apt-get install -qq -y --no-install-recommends

      - name: Cache ncnn and jsoncpp
        uses: actions/cache@v4
        with:
          path: |
            build/hands/build/ncnn/install
            build/deps/jsoncpp
          key: deps-${{ runner.arch }}-${{ hashFiles('frametop/hands/Makefile', 'scripts/build.sh') }}

      - name: Build and check the binaries
        run: scripts/build.sh

      - name: Frametop's recorder tests (standard library)
        run: |
          for t in frametop/hands/rec/tests/test_session.py frametop/hands/rec/tests/test_validate.py \
                   frametop/hands/rec/tests/test_sides.py frametop/hands/rec/tests/test_nohands.py \
                   frametop/hands/tests/test_camcheck.py; do
            echo "== $t"; python3 "$t"
          done

      - name: The window's tests (PySide6 from requirements.txt)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
          FT_HANDREC_QML=$PWD/app/main.qml .venv/bin/python frametop/hands/rec/tests/test_qml_backend.py
          .venv/bin/python -m unittest discover -s tests -v

      - name: Installer syntax
        run: bash -n get-hand-recorder.sh && bash -n bin/frametop-hand-recorder

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: frametop-hand-recorder
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04   # only gh: GitHub's free runner is enough
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frametop-hand-recorder
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          url=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/get-hand-recorder.sh
          pre=()
          case $TAG in *-*)
            url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/get-hand-recorder.sh
            pre=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${pre[@]}" \
            --title "Frametop Hand Recorder ${TAG#v}" \
            --notes "Install or update on a Steam Frame, in Konsole:

          \`\`\`
          curl -fsSL $url | bash
          \`\`\`"
